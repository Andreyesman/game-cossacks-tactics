<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Курсор: гусяче перо. Кінчик (hotspot) — у точці (3,3), стрижень іде вправо-вниз -->
  <!-- Тінь -->
  <path d="M 5 6 C 14 10, 26 18, 34 28 C 38 33, 41 38, 42 42 C 37 40, 31 36, 26 31 C 17 23, 9 13, 5 6 Z"
        fill="#000000" opacity="0.30" transform="translate(1.5,1.5)"/>
  <!-- Стрижень пера (кінчик у (3,3)) -->
  <path d="M 3 3 L 40 40" stroke="#3a2811" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Тіло пера (борідка) — верхня половина -->
  <path d="M 12 10 C 22 12, 32 20, 38 29 C 41 33.5, 43 38, 43.5 41.5 C 39 40.5, 34 38, 29.5 34.5 C 21 28, 14 18, 12 10 Z"
        fill="#f6f0da"/>
  <!-- Нижня половина борідки (трохи темніша) -->
  <path d="M 10 13 C 12 22, 18 30, 26 36 C 30.5 39.5, 36 42.5, 41 43.5 C 38 39, 34 34.5, 29 30.5 C 22.5 25, 15 17, 10 13 Z"
        fill="#e4d9b8"/>
  <!-- Прожилки борідки -->
  <path d="M 17 15 C 23 19, 29 25, 33 31" stroke="#cdbf96" stroke-width="0.9" fill="none"/>
  <path d="M 14 19 C 20 24, 26 30, 31 36" stroke="#cdbf96" stroke-width="0.9" fill="none"/>
  <path d="M 22 14 C 28 19, 33 25, 37 32" stroke="#d9cda8" stroke-width="0.8" fill="none"/>
  <!-- Контур пера -->
  <path d="M 12 10 C 22 12, 32 20, 38 29 C 41 33.5, 43 38, 43.5 41.5 C 39 40.5, 34 38, 29.5 34.5 C 21 28, 14 18, 12 10 Z"
        fill="none" stroke="#8a7a52" stroke-width="0.8" opacity="0.7"/>
  <!-- Металеве писало (кінчик) -->
  <path d="M 3 3 L 12 7.5 L 7.5 12 Z" fill="#c9a227" stroke="#6e5420" stroke-width="0.8"/>
  <!-- Розріз писала -->
  <path d="M 3 3 L 8.5 8.5" stroke="#6e5420" stroke-width="0.7"/>
</svg>
