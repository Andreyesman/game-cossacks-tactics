<svg width="192" height="64" viewBox="0 0 192 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Дерев'яна кнопка: стан pressed — темніша, «втиснута» фаска. 9-patch margin 16px -->
  <defs>
    <linearGradient id="woodp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d2a15"/>
      <stop offset="0.15" stop-color="#46301a"/>
      <stop offset="0.55" stop-color="#52381d"/>
      <stop offset="1" stop-color="#5c4022"/>
    </linearGradient>
  </defs>
  <!-- Темна окантовка -->
  <rect x="1" y="1" width="190" height="62" rx="7" fill="#1c1106"/>
  <!-- Тіло дошки (інвертований градієнт — світло знизу) -->
  <rect x="4" y="4" width="184" height="56" rx="5" fill="url(#woodp)"/>
  <!-- Верхня ТЕМНА фаска (втиснута) -->
  <rect x="6" y="5" width="180" height="4" rx="2" fill="#1c1106" opacity="0.75"/>
  <!-- Нижня СВІТЛА фаска (втиснута) -->
  <rect x="6" y="56" width="180" height="3" rx="1.5" fill="#7d5c33" opacity="0.5"/>
  <!-- Волокна дерева -->
  <rect x="6" y="17" width="180" height="1.6" fill="#33230f" opacity="0.7"/>
  <rect x="6" y="26" width="180" height="1.2" fill="#604730" opacity="0.4"/>
  <rect x="6" y="34" width="180" height="1.8" fill="#2e1f0d" opacity="0.65"/>
  <rect x="6" y="43" width="180" height="1.2" fill="#604730" opacity="0.35"/>
  <rect x="6" y="51" width="180" height="1.5" fill="#33230f" opacity="0.6"/>
  <!-- Сучки -->
  <ellipse cx="13" cy="14" rx="3.2" ry="2.3" fill="#241708" opacity="0.85"/>
  <ellipse cx="13" cy="14" rx="1.5" ry="1.0" fill="#180f05"/>
  <ellipse cx="179" cy="50" rx="3.0" ry="2.2" fill="#241708" opacity="0.85"/>
  <ellipse cx="179" cy="50" rx="1.4" ry="0.9" fill="#180f05"/>
  <!-- Кутові цвяшки -->
  <circle cx="11" cy="53" r="1.8" fill="#180f05"/>
  <circle cx="11.4" cy="53.4" r="0.8" fill="#6e5430"/>
  <circle cx="181" cy="11" r="1.8" fill="#180f05"/>
  <circle cx="181.4" cy="11.4" r="0.8" fill="#6e5430"/>
</svg>
