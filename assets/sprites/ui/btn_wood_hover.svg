<svg width="192" height="64" viewBox="0 0 192 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Дерев'яна кнопка: стан hover — світліша + золотий обідок. 9-patch margin 16px -->
  <defs>
    <linearGradient id="woodh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8c6940"/>
      <stop offset="0.12" stop-color="#7d5c35"/>
      <stop offset="0.5" stop-color="#6e502c"/>
      <stop offset="0.88" stop-color="#604425"/>
      <stop offset="1" stop-color="#533a20"/>
    </linearGradient>
  </defs>
  <!-- Золотий обідок -->
  <rect x="0.75" y="0.75" width="190.5" height="62.5" rx="7.5" fill="none" stroke="#c9a227" stroke-width="1.5"/>
  <!-- Темна окантовка -->
  <rect x="2" y="2" width="188" height="60" rx="6" fill="#241708"/>
  <!-- Тіло дошки -->
  <rect x="5" y="5" width="182" height="54" rx="4.5" fill="url(#woodh)"/>
  <!-- Верхня світла фаска (яскравіша) -->
  <rect x="7" y="6" width="178" height="3" rx="1.5" fill="#b08a4e" opacity="0.65"/>
  <!-- Нижня темна фаска -->
  <rect x="7" y="55" width="178" height="3" rx="1.5" fill="#2e1f0d" opacity="0.6"/>
  <!-- Волокна дерева -->
  <rect x="7" y="16" width="178" height="1.6" fill="#543b1c" opacity="0.65"/>
  <rect x="7" y="25" width="178" height="1.2" fill="#8d6a3c" opacity="0.45"/>
  <rect x="7" y="33" width="178" height="1.8" fill="#4d3418" opacity="0.6"/>
  <rect x="7" y="42" width="178" height="1.2" fill="#8d6a3c" opacity="0.4"/>
  <rect x="7" y="50" width="178" height="1.5" fill="#543b1c" opacity="0.55"/>
  <!-- Сучки -->
  <ellipse cx="14" cy="14" rx="3.2" ry="2.3" fill="#443015" opacity="0.8"/>
  <ellipse cx="14" cy="14" rx="1.5" ry="1.0" fill="#32220d"/>
  <ellipse cx="178" cy="50" rx="3.0" ry="2.2" fill="#443015" opacity="0.8"/>
  <ellipse cx="178" cy="50" rx="1.4" ry="0.9" fill="#32220d"/>
  <!-- Кутові цвяшки (золотіші на hover) -->
  <circle cx="12" cy="52" r="1.8" fill="#241708"/>
  <circle cx="11.6" cy="51.6" r="0.8" fill="#c9a227"/>
  <circle cx="180" cy="12" r="1.8" fill="#241708"/>
  <circle cx="179.6" cy="11.6" r="0.8" fill="#c9a227"/>
</svg>
